[project]
name = "talktoharnesses"
version = "2026.8.0.dev3"
description = "Unified coding-agent harness interface and optional Django app scaffold"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "talktoharnesses contributors" }]
dependencies = [
    "pydantic>=2",
    "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
django = [
    "django>=5.2,<5.3",
    "django-ninja",
    "uvicorn",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-django",
    "hypothesis",
    "pytest-cov",
    "django-stubs",
    "types-pywin32==312.*; sys_platform == 'win32'",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true
default-groups = ["dev"]

[tool.uv.workspace]
members = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
