[project]
name = "talktoharnesses"
version = "2026.8.4"
description = "Unified coding-agent harness interface and optional Django app scaffold"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "talktoharnesses contributors" }]
dependencies = [
    "opentelemetry-api>=1,<2",
    "pydantic>=2",
    "pywin32==312; sys_platform == 'win32'",
]

[project.optional-dependencies]
django = [
    "django>=5.2,<5.3",
    "django-ninja",
    "loguru",
    "PyJWT>=2.8",
    "uvicorn",
]
postgres = [
    "psycopg[binary]>=3.2,<4",
]
client = [
    "httpx>=0.28,<0.29",
]
grok = []
cursor = []
codex = [
    "openai-codex==0.144.4",
]
claude = [
    "claude-agent-sdk==0.1.53",
]
opencode = [
    "talktoharnesses[client]",
]
prime-agent = []
all = [
    "talktoharnesses[django,postgres,grok,cursor,codex,claude,opencode,prime-agent,client]",
]

[dependency-groups]
dev = [
    "ruff",
    "pyright",
    "pytest",
    "pytest-asyncio",
    "pytest-django",
    "pytest-xdist",
    "hypothesis",
    "pytest-cov",
    "django-stubs",
    "types-pywin32==312.*; sys_platform == 'win32'",
    "opentelemetry-sdk>=1,<2",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true
default-groups = ["dev"]

[tool.uv.workspace]
members = []

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]
extend-exclude = ["**/migrations/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pyright]
typeCheckingMode = "strict"
pythonVersion = "3.11"
include = ["src", "tests"]
# Migrations use Django's untyped historical-model API (same reason Ruff skips them).
exclude = ["**/migrations/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
DJANGO_SETTINGS_MODULE = "tests.django_settings"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["talktoharnesses"]
omit = ["*/django/migrations/*"]

[tool.coverage.report]
# The stable release gate enforces --cov-fail-under=91. Keep ordinary Phase 10
# CI and local reports free of that threshold until the Phase 12 stable cut.
omit = ["*/django/migrations/*"]
