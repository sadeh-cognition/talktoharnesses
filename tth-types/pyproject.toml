[project]
name = "tth-types"
version = "0.1.0"
description = "Shared wire schemas for talktoharnesses proxy and harness split services"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "talktoharnesses contributors" }]
dependencies = [
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "ruff",
    "isort",
    "pyrefly>=1.3.1",
    "pytest",
]

[build-system]
requires = ["uv_build>=0.9.18,<0.13"]
build-backend = "uv_build"

[tool.uv]
package = true
default-groups = ["dev"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.isort]
profile = "black"
line_length = 100
src_paths = ["src"]

[tool.pyrefly]
preset = "strict"
python-version = "3.11"
project-includes = ["src", "tests"]
search-path = ["src", "."]

[tool.pyrefly.errors]
# Pyright strict checked neither of these; adopting them is a separate change.
missing-override-decorator = false
open-unpacking = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
