      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --extra django --extra client
      - name: Build sandbox image
        run: ./deploy/build-splits.sh latest codex
      - name: Create/resume gate
        env:
          TALKTOHARNESSES_LIVE_CODEX_SANDBOX: "1"
        run: uv run pytest tests/live/test_codex_sandbox_live.py -q --tb=short

  live-claude:
    name: Live Claude
    if: ${{ inputs.providers == 'all' || contains(inputs.providers, 'claude') }}
