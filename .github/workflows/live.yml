          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --extra django --extra client
      - name: Build sandbox image
        run: ./deploy/build-splits.sh latest claude
      - name: Create/resume gate
        env:
          TALKTOHARNESSES_LIVE_CLAUDE_SANDBOX: "1"
        run: uv run pytest tests/live/test_claude_sandbox_live.py -q --tb=short

  live-opencode:
    name: Live OpenCode
    if: ${{ inputs.providers == 'all' || contains(inputs.providers, 'opencode') }}
