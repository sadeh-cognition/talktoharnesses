name: Live harnesses

on:
  workflow_dispatch:
    inputs:
      providers:
        description: Comma-separated providers to run (grok,cursor,codex,claude,opencode,prime_agent,muse) or all
        required: true
        default: all

env:
  UV_VERSION: "0.12.3"
  PYTHON_VERSION: "3.11"

# Each job runs the kind's Docker sandbox gate: the runner needs Docker and
# the provider's auth file in the runner user's HOME. The image is pre-built
# so pytest timeouts are not spent on the build.
jobs:
  live-grok:
    name: Live Grok
    if: ${{ inputs.providers == 'all' || contains(inputs.providers, 'grok') }}
    runs-on: [self-hosted, talktoharnesses-live, grok]
    environment: live-grok
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --extra django --extra client
      - name: Build sandbox image
        run: ./deploy/build-splits.sh latest grok
      - name: Create/resume gate
        env:
          TALKTOHARNESSES_LIVE_GROK_SANDBOX: "1"
        run: uv run pytest tests/live/test_grok_sandbox_live.py -q --tb=short

  live-cursor:
    name: Live Cursor
    if: ${{ inputs.providers == 'all' || contains(inputs.providers, 'cursor') }}
    runs-on: [self-hosted, talktoharnesses-live, cursor]
    environment: live-cursor
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: ${{ env.UV_VERSION }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --locked --extra django --extra client
      - name: Build sandbox image
        run: ./deploy/build-splits.sh latest cursor
      - name: Create/resume gate
